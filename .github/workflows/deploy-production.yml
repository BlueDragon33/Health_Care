name: Health Live Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-care-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: health-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_PRODUCTION_D1_DATABASE_ID: ${{ secrets.HEALTH_PRODUCTION_D1_DATABASE_ID }}
      HEALTH_PREVIEW_D1_DATABASE_ID: ${{ secrets.HEALTH_PREVIEW_D1_DATABASE_ID }}
      HEALTH_CONTROL_SERVICE_SECRET: ${{ secrets.HEALTH_CONTROL_SERVICE_SECRET }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      HEALTH_PRODUCTION_ORIGIN: ${{ vars.HEALTH_PRODUCTION_ORIGIN }}
      HEALTH_ACCESS_MODE: standalone
    steps:
      - name: Development live mode
        run: echo "main -> live · standalone access"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate production configuration
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HEALTH_PRODUCTION_D1_DATABASE_ID HEALTH_PREVIEW_D1_DATABASE_ID HEALTH_PRODUCTION_ORIGIN; do
            [[ -n "${!key:-}" ]] || { echo "::error::$key is required in health-production."; exit 1; }
          done
          [[ "$HEALTH_PRODUCTION_D1_DATABASE_ID" != "$HEALTH_PREVIEW_D1_DATABASE_ID" ]] || { echo "::error::Production D1 must differ from Preview."; exit 1; }
      - name: Install locked dependencies
        run: npm ci
      - name: Materialize production config
        run: node scripts/prepare-cloudflare-production.mjs
      - name: Apply Production migrations
        run: npx wrangler d1 migrations apply health-care-production-db --remote --config wrangler.cloudflare.production.jsonc
      - name: Build Production runtime
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.production.jsonc
        run: npm run build
      - name: Verify generated Production artifact
        run: node scripts/validate-cloudflare-production-artifact.mjs
      - name: Deploy Health Production Worker
        run: npx wrangler deploy
      - name: Install Health control secret
        run: printf '%s' "$HEALTH_CONTROL_SERVICE_SECRET" | npx wrangler secret put HEALTH_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.production.jsonc
      - name: Restore exact artifact after secret version
        run: npx wrangler deploy
      - name: Smoke test authenticated control plane
        run: |
          set -euo pipefail
          CONTRACT_CODE="$(curl --silent --show-error --output /tmp/health-contract.json --write-out '%{http_code}' --max-time 20 "$HEALTH_PRODUCTION_ORIGIN/api/control/contract")"
          [[ "$CONTRACT_CODE" == "200" ]] || { cat /tmp/health-contract.json; exit 1; }
          CODE="$(curl --silent --show-error --output /tmp/health-status.json --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $HEALTH_CONTROL_SERVICE_SECRET" "$HEALTH_PRODUCTION_ORIGIN/api/control/status")"
          [[ "$CODE" == "200" ]] || { cat /tmp/health-status.json; exit 1; }
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const contract=JSON.parse(fs.readFileSync("/tmp/health-contract.json","utf8"));
          if(contract.application!=="health-care" && contract.canonicalApplication!=="health-care") throw new Error("Health contract identity mismatch.");
          if(contract.endpoints?.devices!=="/api/control/devices") throw new Error("Health device endpoint is missing.");
          if(!Array.isArray(contract.capabilities) || !contract.capabilities.includes("device-access")) throw new Error("Health device-access contract is not ready.");
          const v=JSON.parse(fs.readFileSync("/tmp/health-status.json","utf8"));
          if(v.application!=="child-health" && v.canonicalApplication!=="suc-khoe-y-te") throw new Error("Health Production status identity mismatch.");
          if(!Array.isArray(v.capabilities) || !v.capabilities.includes("app-scoped-secret-v1")) throw new Error("Health scoped control secret is not active.");
          console.log("Health Production control smoke PASS.");
          NODE
