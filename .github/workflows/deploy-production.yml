name: Health Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PRODUCTION để triển khai Health Production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: health-care-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: health-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_PRODUCTION_D1_DATABASE_ID: ${{ secrets.HEALTH_PRODUCTION_D1_DATABASE_ID }}
      HEALTH_PREVIEW_D1_DATABASE_ID: ${{ secrets.HEALTH_PREVIEW_D1_DATABASE_ID }}
      HEALTH_CONTROL_SERVICE_SECRET: ${{ secrets.HEALTH_CONTROL_SERVICE_SECRET }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      HEALTH_PRODUCTION_ORIGIN: ${{ vars.HEALTH_PRODUCTION_ORIGIN }}
    steps:
      - name: Require explicit production confirmation
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirm }}" == "DEPLOY_PRODUCTION" ]] || { echo "::error::Enter DEPLOY_PRODUCTION exactly."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate production configuration
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HEALTH_PRODUCTION_D1_DATABASE_ID HEALTH_PREVIEW_D1_DATABASE_ID HEALTH_CONTROL_SERVICE_SECRET APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN HEALTH_PRODUCTION_ORIGIN; do
            [[ -n "${!key:-}" ]] || { echo "::error::$key is required in health-production."; exit 1; }
          done
          [[ ${#HEALTH_CONTROL_SERVICE_SECRET} -ge 32 ]] || { echo "::error::HEALTH_CONTROL_SERVICE_SECRET must be >=32 chars."; exit 1; }
          [[ "$HEALTH_PRODUCTION_D1_DATABASE_ID" != "$HEALTH_PREVIEW_D1_DATABASE_ID" ]] || { echo "::error::Production D1 must differ from Preview."; exit 1; }
      - name: Install locked dependencies
        run: npm ci
      - name: Preserve Health regressions
        run: |
          npm run validate:growth
          npm run validate:framework
          npm run validate:device
          npm run validate:control
          npm run lint
      - name: Materialize production config
        run: node scripts/prepare-cloudflare-production.mjs
      - name: Apply Production migrations
        run: npx wrangler d1 migrations apply health-care-production-db --remote --config wrangler.cloudflare.production.jsonc
      - name: Build Production runtime
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.production.jsonc
        run: npm run build
      - name: Verify generated Production artifact
        run: node scripts/validate-cloudflare-production-artifact.mjs
      - name: Deploy Health Production Worker
        run: npx wrangler deploy
      - name: Install Health control secret
        run: printf '%s' "$HEALTH_CONTROL_SERVICE_SECRET" | npx wrangler secret put HEALTH_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.production.jsonc
      - name: Restore exact artifact after secret version
        run: npx wrangler deploy
      - name: Smoke test authenticated control plane
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/health-status.json --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $HEALTH_CONTROL_SERVICE_SECRET" "$HEALTH_PRODUCTION_ORIGIN/api/control/status")"
          [[ "$CODE" == "200" ]] || { cat /tmp/health-status.json; exit 1; }
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const v=JSON.parse(fs.readFileSync("/tmp/health-status.json","utf8"));
          if(v.application!=="health-care" && v.canonicalApplication!=="health-care") throw new Error("Health Production identity mismatch.");
          const c=v.capabilities??{};
          if(!c.deviceRegistry) throw new Error("Health device registry is not ready.");
          console.log("Health Production control smoke PASS.");
          NODE
