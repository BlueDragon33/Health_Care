name: Capture Health responsive V8 preview

on:
  push:
    branches:
      - preview/profile-age-v7-20260909

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start preview server
        run: |
          mkdir -p .wrangler
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/health-responsive-v8.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/suc-khoe-tre/visual-preview >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/health-responsive-v8.log
          exit 1
      - name: Capture real browser screenshots
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME"
          BASE_ARGS="--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=10000 --run-all-compositor-stages-before-draw"
          $CHROME $BASE_ARGS --window-size=390,844 --screenshot=health-v8-mobile-390x844.png http://127.0.0.1:4173/suc-khoe-tre/visual-preview
          $CHROME $BASE_ARGS --window-size=768,1024 --screenshot=health-v8-tablet-768x1024.png http://127.0.0.1:4173/suc-khoe-tre/visual-preview
          $CHROME $BASE_ARGS --window-size=1366,768 --screenshot=health-v8-laptop-1366x768.png http://127.0.0.1:4173/suc-khoe-tre/visual-preview
          file health-v8-*.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: health-responsive-v8
          path: health-v8-*.png
          if-no-files-found: error
          retention-days: 3
