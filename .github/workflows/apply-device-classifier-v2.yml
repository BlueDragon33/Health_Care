name: Apply device classifier v2

on:
  push:
    branches:
      - feature/device-auto-classification-v2
    paths:
      - .device-classifier-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/device-auto-classification-v2
          fetch-depth: 0

      - name: Apply classifier patch
        run: python .github/scripts/apply-device-classifier-v2.py

      - name: Commit patched runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -f .device-classifier-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(device): auto-classify Health access devices'
          git push origin HEAD:feature/device-auto-classification-v2
