name: Health Cloudflare Preview Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PREVIEW để xác nhận triển khai môi trường Health preview riêng"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: health-care-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: health-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_PREVIEW_D1_DATABASE_ID: ${{ secrets.HEALTH_PREVIEW_D1_DATABASE_ID }}
      HEALTH_PRODUCTION_D1_DATABASE_ID: ${{ secrets.HEALTH_PRODUCTION_D1_DATABASE_ID }}
      HEALTH_CONTROL_SERVICE_SECRET: ${{ secrets.HEALTH_CONTROL_SERVICE_SECRET }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      HEALTH_PREVIEW_ORIGIN: ${{ vars.HEALTH_PREVIEW_ORIGIN }}
    steps:
      - name: Require explicit preview confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "DEPLOY_PREVIEW" ]]; then
            echo '::error::Deployment cancelled. Enter DEPLOY_PREVIEW exactly.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require Cloudflare preview credentials and app secret
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HEALTH_PREVIEW_D1_DATABASE_ID HEALTH_CONTROL_SERVICE_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in the health-preview GitHub environment."
              exit 1
            fi
          done
          if [[ ${#HEALTH_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::HEALTH_CONTROL_SERVICE_SECRET must contain at least 32 characters.'
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Validate repository before deployment
        run: |
          npm run validate:growth
          npm run validate:framework
          npm run validate:device
          npm run validate:control
          npm run validate:cloudflare-preview
          npm run lint

      - name: Materialize isolated preview config
        run: npm run cloudflare:preview:prepare

      - name: Apply migrations to preview D1 only
        run: npx wrangler d1 migrations apply health-care-preview-db --remote --config wrangler.cloudflare.preview.jsonc

      - name: Build using the Cloudflare preview config
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.preview.jsonc
        run: npm run build

      - name: Verify generated Cloudflare deployment artifact
        run: npm run cloudflare:artifact:check

      - name: Deploy Health preview Worker
        run: npx wrangler deploy

      - name: Install or rotate Health control secret on preview Worker
        shell: bash
        run: printf '%s' "$HEALTH_CONTROL_SERVICE_SECRET" | npx wrangler secret put HEALTH_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.preview.jsonc

      - name: Smoke test configured preview origin
        if: ${{ env.HEALTH_PREVIEW_ORIGIN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$HEALTH_PREVIEW_ORIGIN" in
            https://*.workers.dev|https://*) ;;
            *) echo '::error::HEALTH_PREVIEW_ORIGIN must be an HTTPS origin.'; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 15 "$HEALTH_PREVIEW_ORIGIN/api/control/contract" > /tmp/health-contract.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/health-contract.json', 'utf8'));
          if (payload.application !== 'health-care') throw new Error('Health preview contract application mismatch.');
          const capabilities = Array.isArray(payload.capabilities) ? payload.capabilities : [];
          for (const required of ['device-access', 'device-idempotent-commands', 'device-auto-block-pending']) {
            if (!capabilities.includes(required)) throw new Error(`Health preview contract missing capability: ${required}`);
          }
          console.log('Health preview contract smoke PASS.');
          NODE

      - name: Deployment boundary summary
        shell: bash
        run: |
          echo 'Health_Care preview deployment completed.'
          echo 'D1: health-care-preview-db (isolated from production)'
          echo 'Channel: Cloudflare Workers preview'
          echo 'Automatic production deployment remains disabled.'
