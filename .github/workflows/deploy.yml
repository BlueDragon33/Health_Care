name: Legacy Cloudflare Deploy (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-health-care-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate legacy deployment explicitly
        run: |
          npm run validate:growth
          npm run validate:framework
          npm run validate:device
          npm run validate:control
          npm run lint
          npm run build

      - name: Require legacy Cloudflare credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo '::error::Legacy Cloudflare deployment was requested manually but credentials are not configured.'
          echo 'Primary Application Management integration runs through ChatGPT Sites and does not require this workflow.'
          exit 1

      - name: Apply dedicated D1 migrations
        run: npx wrangler d1 migrations apply suc-khoe-tre-db --remote --config wrangler.d1.jsonc

      - name: Deploy legacy standalone Health Worker
        run: >-
          npx wrangler deploy --name suc-khoe-tre
          --var HEALTH_BUILD_REVISION:${GITHUB_SHA}
          --var HEALTH_BUILD_SOURCE:BlueDragon33/Health_Care
