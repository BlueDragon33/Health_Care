name: Deploy Health_Care to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-health-care-main-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate before deployment
        run: |
          npm run validate:growth
          npm run validate:framework
          npm run validate:device
          npm run validate:control
          npm run lint
          npm run build

      - name: Require Cloudflare deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo '::error::Health_Care passed source validation but production deployment is blocked.'
          echo '::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in this repository before production can be updated.'
          echo 'The existing production Worker was not modified.'
          exit 1

      - name: Apply dedicated D1 migrations
        run: npx wrangler d1 migrations apply suc-khoe-tre-db --remote --config wrangler.d1.jsonc

      - name: Deploy standalone Health Worker
        run: >-
          npx wrangler deploy --name suc-khoe-tre
          --var HEALTH_BUILD_REVISION:${GITHUB_SHA}
          --var HEALTH_BUILD_SOURCE:BlueDragon33/Health_Care
