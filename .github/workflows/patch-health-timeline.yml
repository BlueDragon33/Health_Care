name: Patch Health Timeline

on:
  push:
    branches:
      - feature/health-timeline-9-18
    paths:
      - .health-timeline-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/health-timeline-9-18
      - name: Apply health timeline patch
        run: python .github/scripts/patch-health-timeline.py
      - name: Commit framework integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git diff --cached --quiet || git commit -m "feat(history): integrate health timeline"
          git push
