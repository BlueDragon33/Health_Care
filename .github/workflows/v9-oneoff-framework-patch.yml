name: V9 one-off nutrition runtime patch

on:
  push:
    branches:
      - feature/nutrition-9m-18-v9

permissions:
  contents: write

concurrency:
  group: v9-oneoff-nutrition-runtime
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nutrition-9m-18-v9
          fetch-depth: 0

      - name: Guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/suc-khoe-tre/health-framework.tsx')
          text = path.read_text()
          replacements = [
              ('import { HEALTH_LIFE_STAGES, profileAgeScope, type HealthAgeStage } from "./health-age-scope";',
               'import { HEALTH_LIFE_STAGES, profileAgeScope, type HealthLifeStage } from "./health-age-scope";', 1),
              ('function StagePanel({ stage }: { stage: HealthAgeStage | null })',
               'function StagePanel({ stage }: { stage: HealthLifeStage | null })', 1),
              ('<StagePanel stage={profileAge.stage} />',
               '<StagePanel stage={profileAge.lifeStage} />', 2),
              ('<NutritionStagePanel stage={profileAge.stage} day={day} />',
               '<NutritionStagePanel stage={profileAge.lifeStage} day={day} />', 1),
              ('Checklist nhóm thực phẩm, nước và nhật ký bữa ăn theo ngày; nội dung được cá nhân hóa theo 4 giai đoạn 9–18 tuổi và không dùng chế độ giảm cân người lớn cho trẻ.',
               'Checklist nhóm thực phẩm, nước và nhật ký bữa ăn theo ngày; nội dung được cá nhân hóa liên tục theo 8 giai đoạn từ 9 tháng đến hết 18 tuổi và không dùng chế độ giảm cân người lớn cho trẻ.', 1),
          ]

          changed = False
          for old, new, expected in replacements:
              count = text.count(old)
              if count == 0 and new in text:
                  continue
              if count != expected:
                  raise SystemExit(f'Guard failed for token: expected {expected}, found {count}: {old[:100]}')
              text = text.replace(old, new)
              changed = True

          if changed:
              path.write_text(text)
          PY

      - name: Commit exact runtime patch when needed
        run: |
          if git diff --quiet -- app/suc-khoe-tre/health-framework.tsx; then
            echo "Runtime already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git commit -m "Use continuous life stage in nutrition runtime"
          git push origin HEAD:feature/nutrition-9m-18-v9
