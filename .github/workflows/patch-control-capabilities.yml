name: Patch Health control capabilities

on:
  push:
    branches:
      - feature/control-capabilities
    paths:
      - .control-capabilities-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/control-capabilities
      - name: Apply capability patch
        run: python .github/scripts/patch-control-capabilities.py
      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/device-auth.server.ts
          git diff --cached --quiet || git commit -m "feat(control): publish Health control capabilities"
          git push
