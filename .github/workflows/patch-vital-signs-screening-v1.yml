name: Patch Vital Signs Screening V1

on:
  push:
    branches:
      - feature/vital-signs-screening-v1
    paths:
      - .vital-signs-screening-v1-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vital-signs-screening-v1
      - name: Integrate Vital Signs Screening V1
        run: python .github/scripts/patch-vital-signs-screening-v1.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx app/suc-khoe-tre/page.tsx app/suc-khoe-tre/vital-signs-screening.tsx package.json
          git commit -m "feat(health): integrate vital signs screening v1"
          git push origin HEAD:feature/vital-signs-screening-v1
