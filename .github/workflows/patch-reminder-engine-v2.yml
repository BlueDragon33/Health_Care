name: Patch Reminder Engine V2

on:
  push:
    branches:
      - feature/reminder-engine-v2-9-18
    paths:
      - .reminder-engine-v2-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reminder-engine-v2-9-18
      - name: Apply reminder engine patch
        run: python .github/scripts/patch-reminder-engine-v2.py
      - name: Commit framework integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-local-store.ts app/suc-khoe-tre/health-framework.tsx app/suc-khoe-tre/page.tsx package.json
          git diff --cached --quiet || git commit -m "feat(reminders): integrate reminder engine v2"
          git push
