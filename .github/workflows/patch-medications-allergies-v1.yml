name: Patch Medications Allergies V1

on:
  push:
    branches:
      - feature/medications-allergies-v1
    paths:
      - .medications-allergies-v1-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/medications-allergies-v1
      - name: Integrate Medications Allergies V1
        run: python .github/scripts/patch-medications-allergies-v1.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git diff --cached --quiet || git commit -m "feat(health): integrate medications allergies v1"
          git push
