name: Patch Growth Trend 9-18

on:
  push:
    branches:
      - feature/growth-trend-9-18
    paths:
      - .growth-trend-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/growth-trend-9-18
      - name: Apply growth trend patch
        run: python .github/scripts/patch-growth-trend.py
      - name: Commit framework integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git diff --cached --quiet || git commit -m "feat(growth): integrate 9-18 trend chart"
          git push
