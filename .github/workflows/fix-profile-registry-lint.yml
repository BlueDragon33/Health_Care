name: Fix Profile Registry Lint

on:
  push:
    branches:
      - feature/multi-profile-registry-v1
    paths:
      - .profile-registry-lint-fix-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-profile-registry-v1
      - name: Apply profile registry lint fix
        run: python .github/scripts/fix-profile-registry-lint.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx scripts/validate-profile-registry.mjs
          git diff --cached --quiet || git commit -m "fix(profiles): move identity sync out of effect"
          git push
