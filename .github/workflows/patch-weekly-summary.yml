name: Patch Weekly Health Summary

on:
  push:
    branches:
      - feature/weekly-health-summary-9-18
    paths:
      - .weekly-summary-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/weekly-health-summary-9-18
      - name: Apply weekly summary patch
        run: python .github/scripts/patch-weekly-summary.py
      - name: Commit framework integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git diff --cached --quiet || git commit -m "feat(history): integrate weekly health summaries"
          git push
