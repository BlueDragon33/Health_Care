name: Patch device contract v3

on:
  push:
    branches:
      - fix/device-contract-v3
    paths:
      - .device-contract-v3-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-contract-v3
          fetch-depth: 0
      - name: Bump contract version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app/device-auth.server.ts')
          t=p.read_text()
          old='contractVersion: 2,'
          if old not in t:
              raise SystemExit('contractVersion 2 not found')
          p.write_text(t.replace(old,'contractVersion: 3,',1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/device-auth.server.ts
          git commit -m 'fix(device): publish control contract v3'
          git push origin HEAD:fix/device-contract-v3
