name: Patch Shared Vault Validator Invariants

on:
  push:
    branches:
      - feature/symptom-illness-episode-tracking-v1
    paths:
      - .shared-vault-validator-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/symptom-illness-episode-tracking-v1
      - name: Update validator invariants
        run: python .github/scripts/patch-shared-vault-validator-invariants.py
      - name: Commit validator updates
        run: |
          if git diff --quiet; then
            echo "No validator changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-*.mjs
          git commit -m "test(health): align validators with shared vault boundary"
          git push origin HEAD:feature/symptom-illness-episode-tracking-v1
