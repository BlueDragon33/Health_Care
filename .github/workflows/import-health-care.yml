name: One-shot import Health_Care

on:
  push:
    branches:
      - migration/from-boiech-ai
    paths:
      - .migration-trigger

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Health_Care target
        uses: actions/checkout@v4
        with:
          ref: migration/from-boiech-ai
          fetch-depth: 0

      - name: Checkout BOIECH_AI source
        uses: actions/checkout@v4
        with:
          repository: BlueDragon33/BOIECH_AI
          ref: main
          path: _source
          fetch-depth: 1

      - name: Import complete standalone health application
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            _source/suc-khoe-tre/ ./
          rm -rf _source
          rm -f .migration-trigger

          cat > MIGRATION_SOURCE.md <<'EOF'
          # Migration source

          This repository was split from:

          - source repository: `BlueDragon33/BOIECH_AI`
          - source path: `suc-khoe-tre/`
          - source ref: `main`

          `Health_Care` is now the canonical repository for the standalone Sức khỏe Y tế 9–18 application.
          The Admin Center remains a separate control plane and must communicate through explicit Control APIs only.
          EOF

      - name: Commit imported tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to import.'
            exit 0
          fi
          git commit -m 'chore: import standalone Health_Care from BOIECH_AI'
          git push origin HEAD:migration/from-boiech-ai
