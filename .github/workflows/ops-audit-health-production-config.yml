name: Audit Health production config availability

on:
  push:
    branches: ["ops/audit-production-config-20260925"]

permissions:
  contents: read

jobs:
  audit-repository:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_PRODUCTION_D1_DATABASE_ID: ${{ secrets.HEALTH_PRODUCTION_D1_DATABASE_ID }}
      HEALTH_CONTROL_SERVICE_SECRET: ${{ secrets.HEALTH_CONTROL_SERVICE_SECRET }}
    steps:
      - name: Report repository-level readiness only
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HEALTH_PRODUCTION_D1_DATABASE_ID HEALTH_CONTROL_SERVICE_SECRET; do
            if [[ -n "${!key:-}" ]]; then echo "$key=PRESENT"; else echo "$key=MISSING"; fi
          done
