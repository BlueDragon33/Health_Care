name: Patch Premium Health UI V2

on:
  push:
    branches:
      - feature/premium-health-ui-v2
    paths:
      - .premium-health-ui-v2-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-health-ui-v2
      - name: Integrate premium Health UI V2
        run: python .github/scripts/patch-premium-health-ui-v2.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No premium UI V2 integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git commit -m "feat(ui): integrate premium Health hero V2"
          git push origin HEAD:feature/premium-health-ui-v2
