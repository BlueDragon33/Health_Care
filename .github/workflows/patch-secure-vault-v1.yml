name: Patch Secure Vault V1

on:
  push:
    branches:
      - feature/secure-health-vault-v1
    paths:
      - .secure-vault-v1-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/secure-health-vault-v1
      - name: Integrate Secure Vault V1
        run: python .github/scripts/patch-secure-vault-v1.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx app/suc-khoe-tre/health-secure-vault.ts
          git diff --cached --quiet || git commit -m "feat(vault): integrate secure vault v1"
          git push
