name: Offline Publication Hold CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-development-deploy.yml'
      - '.github/workflows/deploy.yml'
      - 'tests/governance/offline-publication-hold.test.mjs'
      - 'tests/governance/health-constitution-1.3-alignment.test.mjs'
      - '.blueprint/constitution-adoption.json'
      - '.blueprint/dependency-budget.json'
      - 'docs/DEPENDENCY_BUDGET.json'
      - 'docs/DEVELOPMENT_RELEASE_POLICY.md'
      - 'docs/CONSTITUTION-1.3-HEALTH-ADOPTION-AUDIT.json'
      - 'scripts/validate-constitution-1.2-sovereignty.mjs'
      - '.github/workflows/offline-publication-hold-ci.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-development-deploy.yml'
      - '.github/workflows/deploy.yml'
      - 'tests/governance/offline-publication-hold.test.mjs'
      - 'tests/governance/health-constitution-1.3-alignment.test.mjs'
      - '.blueprint/constitution-adoption.json'
      - '.blueprint/dependency-budget.json'
      - 'docs/DEPENDENCY_BUDGET.json'
      - 'docs/DEVELOPMENT_RELEASE_POLICY.md'
      - 'docs/CONSTITUTION-1.3-HEALTH-ADOPTION-AUDIT.json'
      - 'scripts/validate-constitution-1.2-sovereignty.mjs'
      - '.github/workflows/offline-publication-hold-ci.yml'

permissions:
  contents: read

jobs:
  verify-offline-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Verify remote publication is held
        run: node --test tests/governance/offline-publication-hold.test.mjs
      - name: Verify 1.3 policy inheritance and honest offline/Production boundaries
        run: |
          node --test tests/governance/health-constitution-1.3-alignment.test.mjs
          node scripts/validate-constitution-1.2-sovereignty.mjs
      - name: Verify Secure Vault crypto/back-up contracts on actual source
        run: |
          node scripts/validate-secure-vault.mjs
          node scripts/validate-secure-vault-backup.mjs
