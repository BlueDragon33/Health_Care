name: Move Active Profile ID

on:
  push:
    branches:
      - feature/multi-profile-registry-v1
    paths:
      - .active-profile-id-fix-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-profile-registry-v1
      - name: Fix active profile declaration order
        run: python .github/scripts/move-active-profile-id.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git diff --cached --quiet || git commit -m "fix(profiles): declare active profile before effects"
          git push
