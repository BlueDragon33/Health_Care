name: V13 normalize Growth runtime once

on:
  push:
    branches:
      - feature/growth-life-stage-v13

permissions:
  contents: write

concurrency:
  group: v13-normalize-growth-runtime-once
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/growth-life-stage-v13
          fetch-depth: 0

      - name: Apply Growth V13 and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/suc-khoe-tre/health-framework.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          journal_import = 'import JournalStagePanel, { journalConfigForLifeStage, journalObservationOptionsForLifeStage } from "./journal-life-stage";'
          growth_import = 'import { growthConfigForLifeStage, growthSummaryMetric } from "./growth-life-stage";'
          if growth_import not in text:
              replace_once(journal_import, journal_import + '\n' + growth_import, 'growth import')

          profile_age = '  const profileAge = useMemo(() => profileAgeScope(state.profile.birthDate, today), [state.profile.birthDate, today]);'
          growth_derived = '  const growthStage = useMemo(() => growthConfigForLifeStage(profileAge.lifeStage), [profileAge.lifeStage]);\n  const growthSummary = useMemo(() => growthSummaryMetric(profileAge.months, latestGrowth ? calculateBmi(latestGrowth.heightCm, latestGrowth.weightKg) : null), [latestGrowth, profileAge.months]);'
          if growth_derived not in text:
              replace_once(profile_age, profile_age + '\n' + growth_derived, 'growth derived state')

          old_form = '<label>Chiều cao (cm)<input inputMode="decimal" value={heightCm} onChange={(event) => setHeightCm(event.target.value)} placeholder="Ví dụ 156.5" /></label><label>Cân nặng (kg)<input inputMode="decimal" value={weightKg} onChange={(event) => setWeightKg(event.target.value)} placeholder="Ví dụ 48.2" /></label></div><button className="hf-primary" type="button" onClick={addGrowth}>Lưu số đo trên thiết bị</button>'
          new_form = '<label>{growthStage.statureLabel}<input inputMode="decimal" value={heightCm} onChange={(event) => setHeightCm(event.target.value)} placeholder={growthStage.staturePlaceholder} /></label><label>Cân nặng (kg)<input inputMode="decimal" value={weightKg} onChange={(event) => setWeightKg(event.target.value)} placeholder={growthStage.weightPlaceholder} /></label></div><p className="hf-muted">{growthStage.measurementHint}</p><button className="hf-primary" type="button" onClick={addGrowth}>Lưu số đo trên thiết bị</button>'
          replace_once(old_form, new_form, 'growth form')

          old_metric = '<div><strong>{latestGrowth ? calculateBmi(latestGrowth.heightCm, latestGrowth.weightKg)?.toFixed(1) ?? "—" : "—"}</strong><small>BMI</small></div></div>{latestAssessment?.available ?'
          new_metric = '<div><strong>{growthSummary.value}</strong><small>{growthSummary.label}</small></div></div><p className="hf-muted">{growthSummary.detail}</p>{latestAssessment?.available ?'
          replace_once(old_metric, new_metric, 'growth summary metric')

          path.write_text(text)
          PY

          rm -f .github/workflows/v13-normalize-growth-runtime-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx .github/workflows/v13-normalize-growth-runtime-once.yml
          git commit -m "Wire Growth V13 into runtime"
          git push origin HEAD:feature/growth-life-stage-v13
