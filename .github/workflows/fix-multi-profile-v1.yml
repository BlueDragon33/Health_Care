name: Fix Multi Profile V1

on:
  push:
    branches:
      - feature/multi-profile-registry-v1
    paths:
      - .multi-profile-v1-fix-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-profile-registry-v1
      - name: Apply multi-profile syntax fix
        run: python .github/scripts/fix-multi-profile-v1.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git diff --cached --quiet || git commit -m "fix(profiles): correct profile backup naming"
          git push
