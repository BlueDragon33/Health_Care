name: Patch Attention Queue V1

on:
  push:
    branches:
      - feature/attention-queue-v1
    paths:
      - .attention-queue-v1-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attention-queue-v1
      - name: Apply attention queue patch
        run: python .github/scripts/patch-attention-queue-v1.py
      - name: Commit framework integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git diff --cached --quiet || git commit -m "feat(attention): integrate operational attention queue"
          git push
