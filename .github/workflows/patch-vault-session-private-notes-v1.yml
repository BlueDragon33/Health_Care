name: Patch Vault Session Private Notes V1

on:
  push:
    branches:
      - feature/vault-session-private-notes-v1
    paths:
      - .vault-session-private-notes-v1-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vault-session-private-notes-v1
      - name: Integrate vault session and private notes
        run: python .github/scripts/patch-vault-session-private-notes-v1.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git diff --cached --quiet || git commit -m "feat(vault): integrate shared session and private notes"
          git push
