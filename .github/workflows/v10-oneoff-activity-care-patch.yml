name: V10 one-off activity care runtime patch

on:
  push:
    branches:
      - feature/activity-care-life-stage-v10

permissions:
  contents: write

concurrency:
  group: v10-oneoff-activity-care-runtime
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-care-life-stage-v10
          fetch-depth: 0

      - name: Guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/suc-khoe-tre/health-framework.tsx')
          text = path.read_text()
          replacements = [
              ('import NutritionStagePanel from "./nutrition-stage-panel";',
               'import NutritionStagePanel from "./nutrition-stage-panel";\nimport { ActivityStagePanel, CareStagePanel, activityOptionsForLifeStage, shouldShowEyeBreakTracker } from "./activity-care-stage-panel";', 1),
              ('const activityTypes = ["Đi bộ", "Chạy", "Đạp xe", "Bơi", "Bóng đá", "Nhảy dây", "Thể dục", "Khác"];\n',
               '', 1),
              ('const [activityType, setActivityType] = useState(activityTypes[0]);',
               'const [activityType, setActivityType] = useState("Khác");', 1),
              ('const profileAge = useMemo(() => profileAgeScope(state.profile.birthDate, today), [state.profile.birthDate, today]);',
               'const profileAge = useMemo(() => profileAgeScope(state.profile.birthDate, today), [state.profile.birthDate, today]);\n  const activityOptions = useMemo(() => activityOptionsForLifeStage(profileAge.lifeStage), [profileAge.lifeStage]);\n  const selectedActivityType = activityOptions.includes(activityType) ? activityType : activityOptions[0];', 1),
              ('const entry: ActivityEntry = { id: uid("activity"), type: activityType, minutes, createdAt: new Date().toISOString() };',
               'const entry: ActivityEntry = { id: uid("activity"), type: selectedActivityType, minutes, createdAt: new Date().toISOString() };', 1),
              ('<SectionHeader title="Vận động" description="Ghi loại hoạt động và số phút trong ngày để theo dõi thói quen xuyên suốt 9–18 tuổi." aside={formatDate(dayKey)} />\n          <StagePanel stage={profileAge.lifeStage} />\n          <section className="hf-panel">',
               '<SectionHeader title="Vận động" description="Loại hoạt động và cách ghi được đổi theo 8 giai đoạn từ 9 tháng đến hết 18 tuổi; số phút dùng để nhìn xu hướng, không phải điểm thể lực." aside={formatDate(dayKey)} />\n          <StagePanel stage={profileAge.lifeStage} />\n          <ActivityStagePanel stage={profileAge.lifeStage} />\n          <section className="hf-panel">', 1),
              ('<select value={activityType} onChange={(event) => setActivityType(event.target.value)}>{activityTypes.map((item) => <option key={item}>{item}</option>)}</select>',
               '<select value={selectedActivityType} onChange={(event) => setActivityType(event.target.value)}>{activityOptions.map((item) => <option key={item}>{item}</option>)}</select>', 1),
              ('<SectionHeader title="Chăm sóc" description="Giấc ngủ, răng miệng, mắt & học tập và vệ sinh cá nhân; lớp nội dung sẽ thay đổi dần đến giai đoạn tự quản lý sức khỏe trước đại học." aside={formatDate(dayKey)} />\n          <StagePanel stage={profileAge.lifeStage} />\n          <div className="hf-module-grid">',
               '<SectionHeader title="Chăm sóc" description="Giấc ngủ, răng miệng, an toàn, màn hình/học tập và tự chăm sóc được tổ chức theo 8 giai đoạn từ 9 tháng đến hết 18 tuổi." aside={formatDate(dayKey)} />\n          <StagePanel stage={profileAge.lifeStage} />\n          <CareStagePanel stage={profileAge.lifeStage} />\n          <div className="hf-module-grid">', 1),
              ('<article className="hf-module-card"><span className="hf-kicker">Mắt & học tập</span><h3>Lần nghỉ mắt đã ghi</h3><div className="hf-stepper"><button type="button" onClick={() => updateDay((current) => ({ ...current, eyeBreaks: Math.max(0, current.eyeBreaks - 1) }))}>−</button><strong>{day.eyeBreaks}</strong><button type="button" onClick={() => updateDay((current) => ({ ...current, eyeBreaks: Math.min(100, current.eyeBreaks + 1) }))}>+</button></div><small>Chỉ ghi thói quen; không tự chẩn đoán mỏi mắt hoặc tật khúc xạ.</small></article>',
               '{shouldShowEyeBreakTracker(profileAge.lifeStage) ? <article className="hf-module-card"><span className="hf-kicker">Mắt & học tập</span><h3>Lần nghỉ mắt đã ghi</h3><div className="hf-stepper"><button type="button" onClick={() => updateDay((current) => ({ ...current, eyeBreaks: Math.max(0, current.eyeBreaks - 1) }))}>−</button><strong>{day.eyeBreaks}</strong><button type="button" onClick={() => updateDay((current) => ({ ...current, eyeBreaks: Math.min(100, current.eyeBreaks + 1) }))}>+</button></div><small>Chỉ ghi thói quen; không tự chẩn đoán mỏi mắt hoặc tật khúc xạ.</small></article> : <article className="hf-module-card"><span className="hf-kicker">Màn hình & tương tác</span><h3>Không dùng bộ đếm nghỉ mắt cho trẻ nhỏ</h3><small>Nhóm dưới 6 tuổi dùng hướng dẫn theo giai đoạn ở trên; bộ đếm nghỉ mắt kiểu học đường chỉ xuất hiện từ 6 tuổi.</small></article>}', 1),
          ]

          changed = False
          for old, new, expected in replacements:
              count = text.count(old)
              if count == 0 and new in text:
                  continue
              if count != expected:
                  raise SystemExit(f'Guard failed: expected {expected}, found {count}: {old[:120]}')
              text = text.replace(old, new)
              changed = True

          if changed:
              path.write_text(text)
          PY

      - name: Run V10 validator
        run: node scripts/validate-activity-care-life-stage.mjs

      - name: Commit exact runtime patch when needed
        run: |
          if git diff --quiet -- app/suc-khoe-tre/health-framework.tsx; then
            echo "Runtime already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git commit -m "Use life-stage activity and care runtime"
          git push origin HEAD:feature/activity-care-life-stage-v10
