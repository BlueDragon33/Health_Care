name: Capture Health dashboard V5 preview

on:
  push:
    branches:
      - preview/dashboard-v5-20260909

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start preview server
        run: |
          mkdir -p .wrangler
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/health-preview-v5.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/suc-khoe-tre/visual-preview >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/health-preview-v5.log
          exit 1

      - name: Capture real browser screenshot
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --window-size=1536,1024 \
            --virtual-time-budget=10000 \
            --run-all-compositor-stages-before-draw \
            --screenshot=health-dashboard-v5.png \
            http://127.0.0.1:4173/suc-khoe-tre/visual-preview
          file health-dashboard-v5.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: health-dashboard-v5
          path: health-dashboard-v5.png
          if-no-files-found: error
          retention-days: 3
