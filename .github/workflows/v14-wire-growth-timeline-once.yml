name: V14 wire Growth timeline once

on:
  push:
    branches:
      - feature/growth-timeline-age-v14

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/growth-timeline-age-v14
          fetch-depth: 0
      - name: Patch Health runtime and self-remove
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/suc-khoe-tre/health-framework.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { assessWhoBmiForAge, calculateBmi, formatAgeMonths, type WhoBmiAssessment } from "./who-bmi-reference";',
              'import { assessWhoBmiForAge, calculateBmi, completedAgeMonths, formatAgeMonths, type WhoBmiAssessment } from "./who-bmi-reference";',
              'WHO growth import',
          )
          replace_once(
              'import { growthConfigForLifeStage, growthSummaryMetric } from "./growth-life-stage";',
              'import { growthConfigForLifeStage, growthSummaryMetric, growthTimelinePresentation } from "./growth-life-stage";',
              'growth presentation import',
          )

          replace_once(
              'function assessmentFor(entry: GrowthEntry) {\n    return assessWhoBmiForAge({ birthDate: state.profile.birthDate, measurementDate: entry.date, sex: state.profile.sex, heightCm: entry.heightCm, weightKg: entry.weightKg });\n  }',
              'function assessmentFor(entry: GrowthEntry) {\n    return assessWhoBmiForAge({ birthDate: state.profile.birthDate, measurementDate: entry.date, sex: state.profile.sex, heightCm: entry.heightCm, weightKg: entry.weightKg });\n  }\n\n  function timelinePresentationFor(entry: GrowthEntry) {\n    const profileAgeAtMeasurement = completedAgeMonths(state.profile.birthDate, entry.date);\n    const entryBmi = calculateBmi(entry.heightCm, entry.weightKg);\n    return growthTimelinePresentation(profileAgeAtMeasurement, entryBmi);\n  }',
              'timeline presentation helper',
          )

          replace_once(
              '<small>{latestGrowth ? assessmentLabel(latestAssessment) : "Thêm chiều cao và cân nặng để bắt đầu timeline."}</small>',
              '<small>{latestGrowth ? (profileAge.months !== null && profileAge.months < 108 ? growthSummary.detail : assessmentLabel(latestAssessment)) : "Thêm chiều cao và cân nặng để bắt đầu timeline."}</small>',
              'Today growth quick card',
          )

          replace_once(
              '<SectionHeader title="Tăng trưởng từ 9 tháng đến hết 18 tuổi" description={profileAge.months !== null && profileAge.months < 60 ? "Trẻ dưới 5 tuổi cần WHO Child Growth Standards 0–5. Ứng dụng vẫn lưu và vẽ xu hướng số đo nhưng không dùng BMI-for-age 5–19 để phân loại." : "Từ 5 tuổi, BMI-for-age được đối chiếu theo đúng tuổi tính bằng tháng và giới tính với WHO Reference 2007. Kết quả là tham chiếu tăng trưởng, không phải chẩn đoán."} aside={profileAge.text} />',
              '<SectionHeader title="Tăng trưởng từ 9 tháng đến hết 18 tuổi" description={profileAge.months !== null && profileAge.months < 60 ? "Trẻ dưới 5 tuổi cần WHO Child Growth Standards 0–5. Ứng dụng vẫn lưu và vẽ xu hướng số đo nhưng không dùng BMI-for-age 5–19 để phân loại." : profileAge.months !== null && profileAge.months < 108 ? "WHO Reference 2007 có phạm vi từ 5 tuổi, nhưng bảng LMS đã kiểm định trong ứng dụng hiện mới tích hợp từ 9 tuổi. Nhóm 5–8 tuổi chỉ theo dõi xu hướng số đo, không tự nội suy phân loại BMI-for-age." : "Từ 9 tuổi đến hết 18 tuổi, BMI-for-age được đối chiếu theo đúng tuổi tính bằng tháng và giới tính với bảng WHO Reference 2007 đã tích hợp. Kết quả là tham chiếu tăng trưởng, không phải chẩn đoán."} aside={profileAge.text} />',
              'Growth section description',
          )

          replace_once(
              '</div><p className="hf-muted">{growthSummary.detail}</p>{latestAssessment?.available ?',
              '</div><p className="hf-muted">{growthSummary.detail}</p>{profileAge.months !== null && profileAge.months < 108 ? null : latestAssessment?.available ?',
              'latest assessment visibility',
          )

          replace_once(
              '<p className="hf-muted">{profileAge.months !== null && profileAge.months < 60 ? "Nguồn chuẩn cho trẻ dưới 5 tuổi: WHO Child Growth Standards 0–5. Không dùng bảng BMI-for-age 5–19 để phân loại nhóm này." : "Nguồn: WHO Reference 2007 · BMI-for-age 5–19 years. Ứng dụng chủ động giới hạn phạm vi sản phẩm đến hết 18 tuổi 11 tháng."}</p>',
              '<p className="hf-muted">{profileAge.months !== null && profileAge.months < 60 ? "Nguồn chuẩn cho trẻ dưới 5 tuổi: WHO Child Growth Standards 0–5. Không dùng bảng BMI-for-age 5–19 để phân loại nhóm này." : profileAge.months !== null && profileAge.months < 108 ? "Nguồn tham chiếu nền: WHO Reference 2007 · 5–19 years. Bảng LMS định lượng 5–8 tuổi chưa được tích hợp/kiểm định trong ứng dụng nên chỉ hiển thị số đo thô và xu hướng." : "Nguồn: WHO Reference 2007 · BMI-for-age. Bảng LMS đã tích hợp của ứng dụng hiện dùng từ 9 tuổi 0 tháng đến hết 18 tuổi 11 tháng."}</p>',
              'Growth source note',
          )

          replace_once(
              '<section className="hf-panel hf-info-panel"><span className="hf-kicker">Ranh giới 18 → 19 tuổi</span><h3>Không đổi sang BMI người lớn ngay khi tròn 18</h3><p>Từ 9 tháng đến dưới 5 tuổi, chuẩn tăng trưởng phải theo WHO Child Growth Standards 0–5; từ 5 đến hết 18 tuổi mới dùng BMI-for-age theo tháng và giới tính của WHO Reference 2007. Khi bước sang 19 tuổi, hệ thống yêu cầu một chế độ chuyển tiếp người lớn riêng.</p></section>',
              '<section className="hf-panel hf-info-panel"><span className="hf-kicker">Ranh giới tăng trưởng</span><h3>Không suy diễn ngoài bảng tham chiếu đã tích hợp</h3><p>Từ 9 tháng đến dưới 5 tuổi, chuẩn nền là WHO Child Growth Standards 0–5. WHO Reference 2007 bao phủ 5–19 tuổi, nhưng dữ liệu LMS định lượng đã kiểm định trong ứng dụng hiện mới tích hợp từ 9 tuổi đến hết 18 tuổi 11 tháng; nhóm 5–8 tuổi chỉ theo dõi số đo thô. Khi bước sang 19 tuổi, hệ thống yêu cầu chế độ chuyển tiếp người lớn riêng.</p></section>',
              'Growth boundary note',
          )

          replace_once(
              'growth.map((entry) => { const assessment = assessmentFor(entry); return <article',
              'growth.map((entry) => { const assessment = assessmentFor(entry); const presentation = timelinePresentationFor(entry); return <article',
              'timeline map setup',
          )
          replace_once(
              '<span>BMI {calculateBmi(entry.heightCm, entry.weightKg)?.toFixed(1) ?? "—"}</span>',
              '<span>{presentation.metricLabel}</span>',
              'timeline metric',
          )
          replace_once(
              '<span>{assessment.available ? `${formatAgeMonths(assessment.ageMonths)} · z ${assessment.zScore >= 0 ? "+" : ""}${assessment.zScore.toFixed(2)} · ${assessment.categoryLabel}` : assessment.message}</span>',
              '<span>{presentation.useWhoBmiReference ? (assessment.available ? `${formatAgeMonths(assessment.ageMonths)} · z ${assessment.zScore >= 0 ? "+" : ""}${assessment.zScore.toFixed(2)} · ${assessment.categoryLabel}` : assessment.message) : presentation.detail}</span>',
              'timeline detail',
          )

          path.write_text(text)
          PY
          rm .github/workflows/v14-wire-growth-timeline-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx .github/workflows/v14-wire-growth-timeline-once.yml
          git commit -m "Wire Growth V14 age-aware timeline"
          git push origin HEAD:feature/growth-timeline-age-v14
