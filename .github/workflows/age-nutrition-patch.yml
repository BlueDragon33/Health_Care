name: Apply age nutrition patch

on:
  push:
    branches:
      - staging/age-nutrition-reminder-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: age-nutrition-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/age-nutrition-reminder-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Apply deterministic framework integration
        run: node scripts/apply-age-nutrition-v1.mjs
      - name: Commit generated integration if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/suc-khoe-tre/health-framework.tsx
          git commit -m "feat(nutrition): integrate age-stage panel"
          git push origin HEAD:staging/age-nutrition-reminder-audit
