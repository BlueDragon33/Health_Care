name: Apply device management review

on:
  push:
    branches:
      - feature/device-management-review
    paths:
      - .device-management-review-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/device-management-review
          fetch-depth: 0
      - name: Apply review patch
        run: python .github/scripts/apply-device-management-review.py
      - name: Commit runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/device-auth.server.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat(device): preserve detection and flag environment changes'
          git push origin HEAD:feature/device-management-review
